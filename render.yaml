# Render Blueprint for the public ZenRoutine web beta.
# Scope this Blueprint to RogueKostas/ZenRoutine; it must not manage existing services.
services:
  - type: web
    name: zenroutine-web
    runtime: static
    repo: https://github.com/RogueKostas/ZenRoutine
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: EXPO_NO_TELEMETRY
        value: "1"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
